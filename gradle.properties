org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# L'app hôte fournit kotlin-stdlib, kotlinx-coroutines et jsoup : le loader
# instancie l'extension avec le ClassLoader de l'app comme parent
# (ExtensionLoader.PathClassLoader). Les embarquer dupliquerait ~3,4 Mo de dex
# par extension, soit 17 copies chargées en mémoire par l'app.
kotlin.stdlib.default.dependency=false
